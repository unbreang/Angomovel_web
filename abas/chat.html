<!DOCTYPE html>
<html lang="pt-ao">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AngoMovel — Chat</title>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --vermelho: #E8192C;
            --negro:    #0A0A0A;
            --negro2:   #161616;
            --dourado:  #F0B429;
            --branco:   #FFFFFF;
            --fundo:    #F5F0E8;
            --borda:    rgba(0,0,0,0.08);
            --fonte-t:  'Playfair Display', serif;
            --fonte-c:  'Plus Jakarta Sans', sans-serif;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--fonte-c);
            background: var(--fundo);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── HEADER ── */
        .chat-header {
            background: var(--negro);
            padding: 0 20px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            position: relative;
        }

        .chat-header::after {
            content: '';
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, var(--vermelho), var(--dourado));
        }

        .chat-header-esq {
            display: flex; align-items: center; gap: 12px;
        }

        .btn-voltar {
            width: 36px; height: 36px; border-radius: 50%;
            background: rgba(255,255,255,0.08);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 18px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s; text-decoration: none;
        }

        .btn-voltar:hover { background: rgba(255,255,255,0.15); }

        .chat-avatar {
            width: 42px; height: 42px; border-radius: 50%;
            background: linear-gradient(135deg, #CC0000, #E8192C);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--fonte-t); font-size: 18px; font-weight: 900; color: #fff;
            flex-shrink: 0; overflow: hidden;
        }

        .chat-avatar img { width: 100%; height: 100%; object-fit: cover; }

        .chat-header-info h3 { font-size: 15px; font-weight: 700; color: #fff; }
        .chat-header-info p  { font-size: 11px; color: rgba(255,255,255,0.5); }

        .chat-estado {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; font-weight: 600;
        }

        .estado-dot-online {
            width: 8px; height: 8px; border-radius: 50%;
            background: #4CAF50;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* ── RESERVA INFO ── */
        .reserva-info-bar {
            background: #fff;
            border-bottom: 1px solid var(--borda);
            padding: 12px 20px;
            display: flex; align-items: center; gap: 16px;
            flex-shrink: 0; flex-wrap: wrap;
        }

        .res-info-item {
            display: flex; align-items: center; gap: 6px;
            font-size: 12px; color: #555048;
        }

        .res-info-item i { font-size: 14px; color: var(--vermelho); }
        .res-info-item strong { color: #111; }

        .res-estado-badge {
            padding: 4px 12px; border-radius: 999px;
            font-size: 11px; font-weight: 700;
        }

        .badge-pendente     { background: rgba(212,160,23,0.12); color: #D4A017; border: 1px solid rgba(212,160,23,0.25); }
        .badge-aceite       { background: rgba(76,175,80,0.12);  color: #4CAF50; border: 1px solid rgba(76,175,80,0.25); }
        .badge-em_curso     { background: rgba(33,150,243,0.12); color: #2196F3; border: 1px solid rgba(33,150,243,0.25); }
        .badge-concluida    { background: rgba(0,0,0,0.06);      color: #888;    border: 1px solid rgba(0,0,0,0.1); }

        /* ── ÁREA DE MENSAGENS ── */
        .mensagens-area {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .mensagens-area::-webkit-scrollbar { width: 4px; }
        .mensagens-area::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); border-radius: 4px; }

        /* Data separador */
        .data-sep {
            text-align: center;
            font-size: 11px; color: #9a9590;
            display: flex; align-items: center; gap: 10px;
            margin: 8px 0;
        }

        .data-sep::before, .data-sep::after {
            content: ''; flex: 1; height: 1px; background: rgba(0,0,0,0.08);
        }

        /* Mensagem */
        .msg-wrapper {
            display: flex;
            gap: 8px;
            align-items: flex-end;
            max-width: 75%;
        }

        .msg-wrapper.minha { align-self: flex-end; flex-direction: row-reverse; }
        .msg-wrapper.outra { align-self: flex-start; }

        .msg-avatar {
            width: 28px; height: 28px; border-radius: 50%;
            background: linear-gradient(135deg, #CC0000, #E8192C);
            display: flex; align-items: center; justify-content: center;
            font-family: var(--fonte-t); font-size: 11px; font-weight: 900; color: #fff;
            flex-shrink: 0;
        }

        .msg-bubble {
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 14px; line-height: 1.55;
            position: relative;
            word-break: break-word;
        }

        .msg-wrapper.minha .msg-bubble {
            background: var(--vermelho);
            color: #fff;
            border-bottom-right-radius: 4px;
        }

        .msg-wrapper.outra .msg-bubble {
            background: #fff;
            color: #111;
            border-bottom-left-radius: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .msg-hora {
            font-size: 10px; margin-top: 4px; display: block;
        }

        .msg-wrapper.minha .msg-hora { color: rgba(255,255,255,0.7); text-align: right; }
        .msg-wrapper.outra .msg-hora { color: #9a9590; }

        .msg-lida {
            font-size: 12px; color: rgba(255,255,255,0.6);
            margin-left: 4px;
        }

        /* Sistema de mensagem */
        .msg-sistema {
            text-align: center;
            font-size: 12px; color: #9a9590;
            background: rgba(0,0,0,0.04);
            border-radius: 999px;
            padding: 6px 16px;
            align-self: center;
        }

        /* Loading */
        .loading-msgs {
            text-align: center; padding: 40px;
            color: #9a9590;
        }

        .spinner {
            width: 28px; height: 28px;
            border: 3px solid rgba(0,0,0,0.08);
            border-top-color: var(--vermelho);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 10px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Vazio */
        .msgs-vazio {
            text-align: center; padding: 60px 20px;
            color: #9a9590; flex: 1;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .msgs-vazio i { font-size: 48px; opacity: 0.2; margin-bottom: 12px; }
        .msgs-vazio p { font-size: 14px; line-height: 1.6; }

        /* ── INPUT ── */
        .chat-input-area {
            background: #fff;
            border-top: 1px solid var(--borda);
            padding: 12px 16px;
            display: flex; gap: 10px; align-items: flex-end;
            flex-shrink: 0;
        }

        .input-wrap {
            flex: 1;
            background: #F5F0E8;
            border-radius: 24px;
            padding: 10px 16px;
            display: flex; align-items: center; gap: 8px;
            border: 1.5px solid transparent;
            transition: 0.25s;
        }

        .input-wrap:focus-within {
            border-color: var(--vermelho);
            background: #fff;
        }

        .input-msg {
            flex: 1; border: none; background: transparent;
            font-family: var(--fonte-c); font-size: 14px; color: #111;
            resize: none; max-height: 120px; min-height: 22px;
            line-height: 1.55; outline: none;
        }

        .input-msg::placeholder { color: #9a9590; }

        .btn-emoji {
            font-size: 18px; cursor: pointer; opacity: 0.5;
            transition: 0.2s; border: none; background: none;
            flex-shrink: 0;
        }

        .btn-emoji:hover { opacity: 1; }

        .btn-enviar {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--vermelho); border: none;
            color: #fff; font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.25s; flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(232,25,44,0.3);
        }

        .btn-enviar:hover { background: #A00000; transform: scale(1.08); }
        .btn-enviar:disabled { background: #ccc; box-shadow: none; cursor: not-allowed; transform: none; }

        /* Picker de emojis simples */
        .emoji-picker {
            position: absolute; bottom: 70px; left: 16px;
            background: #fff; border-radius: 16px; padding: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            border: 1px solid var(--borda);
            display: none; flex-wrap: wrap; gap: 6px;
            max-width: 280px; z-index: 100;
        }

        .emoji-picker.aberto { display: flex; }
        .emoji-btn { font-size: 22px; cursor: pointer; padding: 4px; border-radius: 8px; transition: 0.15s; border: none; background: none; }
        .emoji-btn:hover { background: var(--fundo); transform: scale(1.2); }

        /* ── RESPONSIVIDADE ── */
        @media (max-width: 600px) {
            .reserva-info-bar { padding: 10px 14px; gap: 10px; }
            .msg-wrapper { max-width: 90%; }
        }
    </style>
</head>
<body>

<!-- HEADER -->
<div class="chat-header">
    <div class="chat-header-esq">
        <a class="btn-voltar" id="btnVoltar" href="#">
            <i class="ph ph-arrow-left"></i>
        </a>
        <div class="chat-avatar" id="chatAvatar">G</div>
        <div class="chat-header-info">
            <h3 id="chatNome">A carregar...</h3>
            <p id="chatSub">Reserva</p>
        </div>
    </div>
    <div class="chat-estado">
        <div class="estado-dot-online" id="estadoOnline" style="display:none;"></div>
        <span id="estadoTexto" style="color:rgba(255,255,255,0.5);font-size:12px;">A ligar...</span>
    </div>
</div>

<!-- INFORMAÇÃO DA RESERVA -->
<div class="reserva-info-bar" id="reservaInfoBar" style="display:none;">
    <div class="res-info-item">
        <i class="ph ph-calendar"></i>
        <span><strong id="resEntrada">—</strong> → <strong id="resSaida">—</strong></span>
    </div>
    <div class="res-info-item">
        <i class="ph ph-users"></i>
        <span><strong id="resPessoas">—</strong> pessoa(s)</span>
    </div>
    <div class="res-info-item">
        <i class="ph ph-currency-circle-dollar"></i>
        <span><strong id="resValor">—</strong> Kz</span>
    </div>
    <span class="res-estado-badge" id="resEstado">—</span>
</div>

<!-- ÁREA DE MENSAGENS -->
<div class="mensagens-area" id="mensagensArea">
    <div class="loading-msgs">
        <div class="spinner"></div>
        <p>A carregar mensagens...</p>
    </div>
</div>

<!-- EMOJI PICKER -->
<div class="emoji-picker" id="emojiPicker">
    😊 😂 🥰 😎 👍 👏 🙏 🔥 ❤️ 🎉 🇦🇴 🌍 🏖️ 🦁 💼 ✅ ❌ ⏳ 📍 💰
    .split(' ').map(e => `<button class="emoji-btn" onclick="addEmoji('${e}')">${e}</button>`).join('')
</div>

<!-- INPUT -->
<div class="chat-input-area">
    <div class="input-wrap">
        <button class="btn-emoji" onclick="toggleEmoji()" title="Emojis">😊</button>
        <textarea
            class="input-msg"
            id="inputMsg"
            placeholder="Escreve uma mensagem..."
            rows="1"
            onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();enviarMsg();}"
            oninput="autoResize(this)"
        ></textarea>
    </div>
    <button class="btn-enviar" id="btnEnviar" onclick="enviarMsg()">
        <i class="ph-fill ph-paper-plane-right"></i>
    </button>
</div>

<script>
    const API        = 'http://localhost:3000/api/v1';
    const token      = localStorage.getItem('angomovel_token');
    const user       = JSON.parse(localStorage.getItem('angomovel_user') || '{}');
    const sessaoStudio = JSON.parse(localStorage.getItem('angomovel_studio_sessao') || '{}');

    // Obter reserva_id e tipo da URL
    const params     = new URLSearchParams(window.location.search);
    const reservaId  = params.get('reserva_id');
    const voltarUrl  = params.get('voltar') || '../angomovel.html';

    // Determinar utilizador actual
    const userActual = user.id ? user : JSON.parse(localStorage.getItem('angomovel_guia') || '{}');
    const userId     = userActual.id || userActual.email;
    const userNome   = userActual.nome || 'Utilizador';
    const userRole   = userActual.role || sessaoStudio.tipo || 'cliente';

    // Configura botão voltar
    document.getElementById('btnVoltar').href = voltarUrl;

    if (!reservaId) {
        document.getElementById('mensagensArea').innerHTML = `
            <div class="msgs-vazio">
                <i class="ph ph-warning-circle"></i>
                <p>Reserva não encontrada.<br>Volta para as tuas reservas.</p>
            </div>`;
    }

    // ── Socket.io ──
    let socket = null;

    function ligarSocket() {
        socket = io('http://localhost:3000/chat', {
            transports: ['websocket', 'polling'],
        });

        socket.on('connect', () => {
            document.getElementById('estadoOnline').style.display = 'block';
            document.getElementById('estadoTexto').textContent = 'Ligado';
            document.getElementById('estadoTexto').style.color = '#4CAF50';

            // Entrar na sala
            socket.emit('entrar_sala', {
                reserva_id: reservaId,
                user_id:    userId,
            });
        });

        socket.on('disconnect', () => {
            document.getElementById('estadoOnline').style.display = 'none';
            document.getElementById('estadoTexto').textContent = 'Desligado';
            document.getElementById('estadoTexto').style.color = 'rgba(255,255,255,0.4)';
        });

        // Histórico de mensagens
        socket.on('historico', (msgs) => {
            renderMensagens(msgs);
        });

        // Nova mensagem recebida
        socket.on('nova_mensagem', (msg) => {
            adicionarMensagem(msg);
            scrollParaBaixo();

            // Marcar como lida se não é nossa
            if (msg.remetente_id !== userId) {
                socket.emit('marcar_lida', { reserva_id: reservaId, user_id: userId });
            }
        });
    }

    // ── Carregar info da reserva ──
    async function carregarReserva() {
        try {
            const headers = token ? { 'Authorization': `Bearer ${token}` } : {};
            const res = await fetch(`${API}/reservas/${reservaId}`, { headers });

            if (res.ok) {
                const r = await res.json();

                // Nome do interlocutor
                const isCliente = userRole === 'cliente';
                const nomeOutro = isCliente ? r.guia_nome : r.cliente_nome;

                document.getElementById('chatNome').textContent = nomeOutro || 'Chat';
                document.getElementById('chatSub').textContent  = `Reserva #${reservaId.slice(0,8)}`;
                document.getElementById('chatAvatar').textContent = (nomeOutro || 'G')[0].toUpperCase();

                // Info da reserva
                document.getElementById('reservaInfoBar').style.display = 'flex';
                document.getElementById('resEntrada').textContent = formatData(r.data_entrada);
                document.getElementById('resSaida').textContent   = formatData(r.data_saida);
                document.getElementById('resPessoas').textContent = r.num_pessoas || 1;
                document.getElementById('resValor').textContent   = formatKz(r.valor_total);

                const estadoEl = document.getElementById('resEstado');
                estadoEl.textContent = traduzirEstado(r.estado);
                estadoEl.className   = `res-estado-badge badge-${r.estado}`;
            }
        } catch (e) {
            console.error('Erro ao carregar reserva:', e);
            document.getElementById('chatNome').textContent = 'Chat da Reserva';
        }
    }

    // ── Render histórico ──
    function renderMensagens(msgs) {
        const area = document.getElementById('mensagensArea');

        if (!msgs.length) {
            area.innerHTML = `
                <div class="msgs-vazio">
                    <i class="ph ph-chat-dots"></i>
                    <p>Ainda não há mensagens.<br>Envia a primeira mensagem!</p>
                </div>`;
            return;
        }

        area.innerHTML = '';
        let ultimaData = '';

        msgs.forEach(msg => {
            const dataMsg = new Date(msg.criado_em).toLocaleDateString('pt-AO');
            if (dataMsg !== ultimaData) {
                const sep = document.createElement('div');
                sep.className = 'data-sep';
                sep.textContent = dataMsg;
                area.appendChild(sep);
                ultimaData = dataMsg;
            }
            area.appendChild(criarBolha(msg));
        });

        scrollParaBaixo();
    }

    // ── Criar bolha de mensagem ──
    function criarBolha(msg) {
        const isMinha = msg.remetente_id === userId ||
                        msg.remetente_nome === userNome;

        const wrapper = document.createElement('div');
        wrapper.className = `msg-wrapper ${isMinha ? 'minha' : 'outra'}`;

        const hora = new Date(msg.criado_em).toLocaleTimeString('pt-AO', {
            hour: '2-digit', minute: '2-digit'
        });

        if (!isMinha) {
            const av = document.createElement('div');
            av.className = 'msg-avatar';
            av.textContent = (msg.remetente_nome || 'U')[0].toUpperCase();
            wrapper.appendChild(av);
        }

        const content = document.createElement('div');
        content.innerHTML = `
            <div class="msg-bubble">${escapeHtml(msg.conteudo)}</div>
            <span class="msg-hora">
                ${hora}
                ${isMinha ? `<span class="msg-lida">${msg.lida ? '✓✓' : '✓'}</span>` : ''}
            </span>
        `;

        wrapper.appendChild(content);
        return wrapper;
    }

    // ── Adicionar nova mensagem ──
    function adicionarMensagem(msg) {
        const area = document.getElementById('mensagensArea');

        // Remover estado vazio se existir
        const vazio = area.querySelector('.msgs-vazio');
        if (vazio) vazio.remove();

        area.appendChild(criarBolha(msg));
    }

    // ── Enviar mensagem ──
    function enviarMsg() {
        const input   = document.getElementById('inputMsg');
        const conteudo = input.value.trim();

        if (!conteudo || !socket || !reservaId) return;

        socket.emit('enviar_mensagem', {
            reserva_id:     reservaId,
            remetente_id:   userId,
            remetente_nome: userNome,
            remetente_role: userRole,
            conteudo,
        });

        input.value = '';
        input.style.height = 'auto';
    }

    // ── Emojis ──
    const emojis = ['😊','😂','🥰','😎','👍','👏','🙏','🔥','❤️','🎉','🇦🇴','🌍','🏖️','🦁','💼','✅','❌','⏳','📍','💰'];

    function toggleEmoji() {
        const picker = document.getElementById('emojiPicker');
        picker.classList.toggle('aberto');
        if (picker.classList.contains('aberto') && !picker.dataset.loaded) {
            picker.innerHTML = emojis.map(e =>
                `<button class="emoji-btn" onclick="addEmoji('${e}')">${e}</button>`
            ).join('');
            picker.dataset.loaded = '1';
        }
    }

    function addEmoji(emoji) {
        const input = document.getElementById('inputMsg');
        input.value += emoji;
        input.focus();
        document.getElementById('emojiPicker').classList.remove('aberto');
    }

    // Fechar emoji picker ao clicar fora
    document.addEventListener('click', e => {
        if (!e.target.closest('.btn-emoji') && !e.target.closest('.emoji-picker')) {
            document.getElementById('emojiPicker').classList.remove('aberto');
        }
    });

    // ── Auto resize textarea ──
    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 120) + 'px';
    }

    // ── Scroll para baixo ──
    function scrollParaBaixo() {
        const area = document.getElementById('mensagensArea');
        area.scrollTop = area.scrollHeight;
    }

    // ── Utils ──
    function formatData(d) {
        return new Date(d).toLocaleDateString('pt-AO', { day:'2-digit', month:'short' });
    }

    function formatKz(n) {
        return new Intl.NumberFormat('pt-AO').format(Math.round(n || 0));
    }

    function traduzirEstado(e) {
        const t = { pendente:'⏳ Pendente', aceite:'✅ Aceite', em_curso:'🔵 Em curso', concluida:'✔️ Concluída', recusada:'❌ Recusada', cancelada:'🚫 Cancelada' };
        return t[e] || e;
    }

    function escapeHtml(str) {
        return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
    }

    // ── Iniciar ──
    if (reservaId) {
        carregarReserva();
        ligarSocket();
    }
</script>

</body>
</html>
